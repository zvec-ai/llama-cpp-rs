[package]
name = "native-smoke"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
llama-cpp-2 = { path = "../../llama-cpp-2", default-features = false }
llama-cpp-sys-2 = { path = "../../llama-cpp-sys-2" }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"

[features]
cuda = ["llama-cpp-2/cuda", "llama-cpp-2/dynamic-backends"]
