name: Native runtime release

on:
  workflow_dispatch:
    inputs:
      reuse_runs:
        description: Optional comma-separated successful native run IDs to repackage (Intel macOS always rebuilds)
        type: string
        default: ''
      publish:
        description: Publish one unified pre-release after every validation gate
        type: boolean
        default: false
      linux_only:
        description: Validate Linux SDKs only, without publishing a release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'zvec-ai/llama-cpp-rs'
    env:
      DOCKER_BUILDKIT: '1'
      REUSE_RUNS: ${{ inputs.reuse_runs }}
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.linux_only && '[{"target":"aarch64-unknown-linux-gnu","variant":"cpu","runner":"ubuntu-24.04-arm","reuse":true},{"target":"x86_64-unknown-linux-gnu","variant":"cpu","runner":"ubuntu-24.04","reuse":true},{"target":"x86_64-unknown-linux-gnu","variant":"cuda","runner":"ubuntu-24.04","reuse":true}]' ||
          '[{"target":"aarch64-apple-darwin","variant":"metal","runner":"macos-15-xlarge","reuse":true},{"target":"x86_64-apple-darwin","variant":"cpu","runner":"macos-15-intel","reuse":false},{"target":"aarch64-unknown-linux-gnu","variant":"cpu","runner":"ubuntu-24.04-arm","reuse":true},{"target":"x86_64-unknown-linux-gnu","variant":"cpu","runner":"ubuntu-24.04","reuse":true},{"target":"x86_64-unknown-linux-gnu","variant":"cuda","runner":"ubuntu-24.04","reuse":true},{"target":"x86_64-pc-windows-msvc","variant":"cpu","runner":"windows-2022","reuse":true},{"target":"x86_64-pc-windows-msvc","variant":"cuda","runner":"windows-2022","reuse":true},{"target":"aarch64-pc-windows-msvc","variant":"cpu","runner":"windows-11-vs2026-arm","reuse":true}]') }}
    name: SDK ${{ matrix.target }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.98.0'
      - name: Configure conservative build parallelism
        shell: node {0}
        run: |
          const os = require('node:os');
          const fs = require('node:fs');
          const cores = os.availableParallelism();
          const memoryGiB = os.totalmem() / (1024 ** 3);
          const jobs = Math.max(1, Math.min(cores, Math.floor(memoryGiB / 3), 8));
          fs.appendFileSync(process.env.GITHUB_ENV,
            `CARGO_BUILD_JOBS=${jobs}\nCMAKE_BUILD_PARALLEL_LEVEL=${jobs}\n`);
          console.log(`cores=${cores}, RAM=${memoryGiB.toFixed(1)} GiB, jobs=${jobs}`);
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Install MSVC 14.38 for the CUDA 12 fallback
        if: runner.os == 'Windows' && matrix.variant == 'cuda' && !(inputs.reuse_runs && matrix.reuse)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw 'Visual Studio 2022 C++ tools are missing' }
          $compiler = "$vs/VC/Tools/MSVC/14.38.*/bin/Hostx64/x64/cl.exe"
          if (-not (Test-Path $compiler)) {
            $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/setup.exe"
            $result = Start-Process $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64', '--quiet', '--norestart') -Wait -PassThru
            if ($result.ExitCode -notin @(0, 3010)) { throw "MSVC installation failed: $($result.ExitCode)" }
          }
          if (-not (Test-Path $compiler)) { throw 'MSVC 14.38 is missing after installation' }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && matrix.target != 'aarch64-pc-windows-msvc'
        with:
          arch: x64
          vsversion: '2022'
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target == 'aarch64-pc-windows-msvc'
        with:
          arch: arm64
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        if: runner.os == 'Windows' && matrix.variant == 'cuda' && !(inputs.reuse_runs && matrix.reuse)
        with:
          cuda: '13.1.1'
          method: network
          sub-packages: '["nvcc", "nvvm", "crt", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
          use-local-cache: true
      - name: Configure Windows CUDA 13 DLL lookup
        if: runner.os == 'Windows' && matrix.variant == 'cuda' && !(inputs.reuse_runs && matrix.reuse)
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ['CUDA_PATH'])
          paths = [str(path) for path in (root / 'bin' / 'x64', root / 'bin') if path.is_dir()]
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(paths) + '\n')
      - uses: actions/cache/restore@v5
        if: ${{ !(inputs.reuse_runs && matrix.reuse) }}
        id: native-cache
        with:
          path: |
            ~/.cargo/registry/
            target/native-build/
          key: native-v4-${{ matrix.variant }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'native/Dockerfile', 'native/build-requirements.txt', 'native/*.cmake', 'native/*.sh') }}-${{ github.sha }}
          restore-keys: native-v4-${{ matrix.variant }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'native/Dockerfile', 'native/build-requirements.txt', 'native/*.cmake', 'native/*.sh') }}-
      - name: Test packaging contract
        run: python -m unittest discover -s native -p 'test_*.py' -v
      - name: Test SDK selection, ABI checks, and cache failures
        run: cargo test --locked -p native-contract-tests
      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Repackage verified native payload and preserve build provenance
        if: inputs.reuse_runs && matrix.reuse
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, subprocess
          subprocess.run(["python", "native/reuse.py", "--runs", os.environ["REUSE_RUNS"],
                          "--target", "${{ matrix.target }}", "--variant", "${{ matrix.variant }}"], check=True)

      - name: Build primary through the upstream Cargo build script
        if: runner.os != 'Linux' && !(inputs.reuse_runs && matrix.reuse)
        run: python native/runtime.py primary --target ${{ matrix.target }} --variant ${{ matrix.variant }}
      - name: Build Linux SDK and consumer images on glibc 2.28
        if: runner.os == 'Linux'
        env:
          BUILDER: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant == 'cuda' && 'cuda13' || 'cpu' }}
        run: |
          docker build --target cpu -f native/Dockerfile -t llama-native-cpu .
          if [ -z "$REUSE_RUNS" ]; then
            docker build --target "$BUILDER" -f native/Dockerfile -t llama-native-primary .
          fi
          docker build --target runtime-cpu -f native/Dockerfile -t llama-native-runtime-cpu .
          docker run --rm -v "$GITHUB_WORKSPACE:/work" \
            llama-native-cpu python3 -m unittest discover -s native -p 'test_*.py' -v
      - name: Build Linux primary against glibc 2.28
        if: runner.os == 'Linux' && !(inputs.reuse_runs && matrix.reuse)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -e CARGO_BUILD_JOBS -e CMAKE_BUILD_PARALLEL_LEVEL \
            llama-native-primary bash -euc '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              python3 native/runtime.py primary --target "$1" --variant "$2"
            ' bash '${{ matrix.target }}' '${{ matrix.variant }}'
      - name: Build Linux CUDA 12.4 fallback only
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant == 'cuda' && !(inputs.reuse_runs && matrix.reuse)
        run: |
          docker build --target cuda12 -f native/Dockerfile -t llama-native-cuda12 .
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -e CMAKE_BUILD_PARALLEL_LEVEL \
            llama-native-cuda12 bash -euc '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              python3 native/runtime.py fallback
            '
      - name: Restore output ownership
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" target
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        if: runner.os == 'Windows' && matrix.variant == 'cuda' && !(inputs.reuse_runs && matrix.reuse)
        with:
          cuda: '12.4.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust"]'
          use-local-cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && matrix.variant == 'cuda' && !(inputs.reuse_runs && matrix.reuse)
        with:
          arch: x64
          vsversion: '2022'
          toolset: '14.38'
      - name: Build Windows CUDA 12.4 fallback only
        if: runner.os == 'Windows' && matrix.variant == 'cuda' && !(inputs.reuse_runs && matrix.reuse)
        run: python native/runtime.py fallback --cuda-root "$env:CUDA_PATH"
      - uses: actions/cache/save@v5
        if: always() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true' && !(inputs.reuse_runs && matrix.reuse)
        with:
          path: |
            ~/.cargo/registry/
            target/native-build/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Package the complete SDK
        run: python native/runtime.py package
      - name: Extract the exact release archive
        run: python native/unpack.py --artifacts target/dist --output target/relocated/bundle
      - name: Rebuild a Rust consumer without bindgen or native compilation
        if: runner.os != 'Linux'
        run: python native/runtime.py external --bundle target/relocated/bundle --target-dir target/external-consumer
      - name: Rebuild the Linux consumer on glibc 2.28 without a CUDA toolkit
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -e CARGO_BUILD_JOBS \
            llama-native-cpu bash -euc '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              python3 native/runtime.py external --bundle target/relocated/bundle --target-dir target/external-consumer
            '
          sudo chown -R "$(id -u):$(id -g)" target
      - uses: actions/cache@v5
        with:
          path: target/models/
          key: native-embeddinggemma-models-b5ce9d77-2188ac1d
      - name: Real CPU embedding from the relocated SDK
        if: runner.os != 'Linux'
        run: python native/e2e.py --bundle target/relocated/bundle --mode cpu
      - name: EmbeddingGemma 2 CPU inference
        if: runner.os != 'Linux'
        run: python native/e2e.py --bundle target/relocated/bundle --mode cpu --model-kind embeddinggemma2 --logs target/evidence/gemma2
      - name: Real Linux CPU inference on clean glibc 2.28
        if: runner.os == 'Linux'
        env:
          CUDA_SDK: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && matrix.variant == 'cuda' && '1' || '0' }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -e CUDA_SDK \
            llama-native-runtime-cpu bash -euc '
            test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
            if [ "$CUDA_SDK" = 1 ]; then
              ldd /work/target/relocated/bundle/lib/libggml-cuda.so | grep -Eq "lib(cuda|cudart|cublas).*not found"
            fi
            cd /work && python3 native/e2e.py --bundle target/relocated/bundle --mode cpu --logs target/evidence/no-cuda
            python3 native/e2e.py --bundle target/relocated/bundle --mode cpu --model-kind embeddinggemma2 --logs target/evidence/gemma2
          '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Actual Metal offload from the final archive
        if: matrix.variant == 'metal'
        run: |
          python native/e2e.py --bundle target/relocated/bundle --mode metal --logs target/evidence/metal
          python native/e2e.py --bundle target/relocated/bundle --mode metal --model-kind embeddinggemma2 --logs target/evidence/gemma2-metal
      - name: Audit dynamic dependencies and Linux glibc 2.28 ceiling
        run: python native/audit.py --bundle target/relocated/bundle --logs target/evidence
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}-${{ matrix.variant }}
          path: target/dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: matrix.variant == 'cuda' && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc')
        with:
          name: probe-${{ matrix.target }}
          path: target/relocated/probe/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.target }}-${{ matrix.variant }}
          path: target/evidence/
          if-no-files-found: warn

  cuda-linux:
    needs: build
    env:
      DOCKER_BUILDKIT: '1'
    runs-on:
      group: gpu-runners
      labels: gpu-linux-t4
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-unknown-linux-gnu-cuda
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: probe-x86_64-unknown-linux-gnu
          path: target/relocated/probe
      - run: |
          python3 native/unpack.py --artifacts artifacts --output target/relocated/bundle
          chmod +x target/relocated/probe/native-smoke
      - uses: actions/cache@v5
        with:
          path: target/models/
          key: native-embeddinggemma-models-b5ce9d77-2188ac1d
      - name: Real CUDA 12 fallback and CUDA 13 primary offload on glibc 2.28
        run: |
          for mode in cuda12 cuda13; do
            docker build --target "runtime-$mode" -f native/Dockerfile -t "llama-native-runtime-$mode" .
            docker run --rm --gpus all -v "$GITHUB_WORKSPACE:/work" "llama-native-runtime-$mode" bash -euc '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              cd /work && python3 native/e2e.py --bundle target/relocated/bundle --mode "$1" --logs "target/gpu-evidence/$1"
              python3 native/e2e.py --bundle target/relocated/bundle --mode "$1" --model-kind embeddinggemma2 --logs "target/gpu-evidence/gemma2-$1"
            ' bash "$mode"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-evidence-linux
          path: target/gpu-evidence/

  cuda-windows:
    needs: build
    if: '!inputs.linux_only'
    runs-on:
      group: gpu-runners
      labels: gpu-windows-t4
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare the same ephemeral GPU driver as zg
        shell: powershell
        run: ./native/prepare-windows-driver.ps1 -DriverOnly
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-pc-windows-msvc-cuda
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: probe-x86_64-pc-windows-msvc
          path: target/relocated/probe
      - run: python native/unpack.py --artifacts artifacts --output target/relocated/bundle
      - uses: actions/cache@v5
        with:
          path: target/models/
          key: native-embeddinggemma-models-b5ce9d77-2188ac1d
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["cudart", "cublas"]'
          use-local-cache: true
      - name: Verify fallback with CUDA 13 hidden
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:CUDA_PATH/bin;" + (($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'cublas64_13.dll'))
          }) -join ';')
          python native/e2e.py --bundle target/relocated/bundle --mode cuda12 --logs target/gpu-evidence/cuda12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/e2e.py --bundle target/relocated/bundle --mode cuda12 --model-kind embeddinggemma2 --logs target/gpu-evidence/gemma2-cuda12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '13.1.1'
          method: network
          sub-packages: '["cudart", "cublas"]'
          use-local-cache: true
      - name: Verify CUDA 13 primary
        shell: powershell
        run: |
          $env:PATH = "$env:CUDA_PATH/bin/x64;$env:CUDA_PATH/bin;$env:PATH"
          python native/e2e.py --bundle target/relocated/bundle --mode cuda13 --logs target/gpu-evidence/cuda13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/e2e.py --bundle target/relocated/bundle --mode cuda13 --model-kind embeddinggemma2 --logs target/gpu-evidence/gemma2-cuda13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gpu-evidence-windows
          path: target/gpu-evidence/

  metadata:
    needs: [build, cuda-linux, cuda-windows]
    if: '!inputs.linux_only'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*evidence-*'
          path: evidence
      - name: Require all eight SDKs and their exact-archive evidence
        run: python3 native/publish.py --assets release --evidence evidence --prepare-only
      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: |
            release/runtime-lock.json
            release/SHA256SUMS
            release/validation-report.md
            release/release-notes.md

  release:
    needs: [build, metadata, cuda-linux, cuda-windows]
    if: >-
      !inputs.linux_only && inputs.publish && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/codex/upstream-main-sdk-refresh'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: '*evidence-*'
          path: evidence
      - name: Stage draft, verify uploaded bytes, then publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 native/publish.py --assets release --evidence evidence
      - name: Verify all 19 public assets without authentication
        run: python3 native/verify_downloads.py --expected release --output target/public-downloads

  download-consumers:
    needs: release
    name: Public prebuilt ${{ matrix.target }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('[{"target":"aarch64-apple-darwin","variant":"metal","runner":"macos-15-xlarge","reuse":true},{"target":"x86_64-apple-darwin","variant":"cpu","runner":"macos-15-intel","reuse":false},{"target":"aarch64-unknown-linux-gnu","variant":"cpu","runner":"ubuntu-24.04-arm","reuse":true},{"target":"x86_64-unknown-linux-gnu","variant":"cpu","runner":"ubuntu-24.04","reuse":true},{"target":"x86_64-unknown-linux-gnu","variant":"cuda","runner":"ubuntu-24.04","reuse":true},{"target":"x86_64-pc-windows-msvc","variant":"cpu","runner":"windows-2022","reuse":true},{"target":"x86_64-pc-windows-msvc","variant":"cuda","runner":"windows-2022","reuse":true},{"target":"aarch64-pc-windows-msvc","variant":"cpu","runner":"windows-11-vs2026-arm","reuse":true}]') }}
    env:
      DOCKER_BUILDKIT: '1'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.98.0'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: metadata
      - name: Install exact published pins and fetch public SDK
        shell: python
        run: |
          import json, shutil, subprocess
          from pathlib import Path
          lock = Path('metadata/runtime-lock.json')
          shutil.copyfile(lock, 'llama-cpp-sys-2/build_support/runtime-lock.json')
          entry = json.loads(lock.read_text())['targets']['${{ matrix.target }}']['${{ matrix.variant }}']
          subprocess.run(['python', 'native/fetch.py', '--target', '${{ matrix.target }}',
                          '--variant', '${{ matrix.variant }}', '--sha256', entry['sha256'],
                          '--lock', str(lock), '--output', 'target/relocated/bundle'], check=True)
      - name: Build public prebuilt consumer with cold cache and reuse offline
        if: runner.os != 'Linux'
        run: python native/runtime.py prebuilt --bundle target/relocated/bundle --lock metadata/runtime-lock.json --target-dir target/public-consumer
      - name: Build public prebuilt Linux consumer on glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker build --target cpu -f native/Dockerfile -t llama-native-cpu .
          docker build --target runtime-cpu -f native/Dockerfile -t llama-native-runtime-cpu .
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -e CARGO_BUILD_JOBS llama-native-cpu \
            python3 native/runtime.py prebuilt --bundle target/relocated/bundle --lock metadata/runtime-lock.json --target-dir target/public-consumer
          sudo chown -R "$(id -u):$(id -g)" target
      - uses: actions/cache@v5
        with:
          path: target/models/
          key: native-embeddinggemma-models-b5ce9d77-2188ac1d
      - name: Run both models from downloaded SDK
        if: runner.os != 'Linux'
        run: |
          python native/e2e.py --bundle target/relocated/bundle --mode cpu
          python native/e2e.py --bundle target/relocated/bundle --mode cpu --model-kind embeddinggemma2 --logs target/evidence/gemma2
      - name: Run both models on clean glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" llama-native-runtime-cpu bash -euc '
            python3 native/e2e.py --bundle target/relocated/bundle --mode cpu
            python3 native/e2e.py --bundle target/relocated/bundle --mode cpu --model-kind embeddinggemma2 --logs target/evidence/gemma2
          '
          sudo chown -R "$(id -u):$(id -g)" target
      - name: Audit the public SDK and consumer
        run: python native/audit.py --bundle target/relocated/bundle --logs target/evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-evidence-${{ matrix.target }}-${{ matrix.variant }}
          path: target/evidence/
